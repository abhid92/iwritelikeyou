<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E3A2F"/>

  <!-- Subtle texture dots -->
  <circle cx="100" cy="80" r="180" fill="#25462E" opacity="0.5"/>
  <circle cx="1100" cy="550" r="160" fill="#162E22" opacity="0.5"/>

  <!-- Speech bubble - left (white outline) -->
  <ellipse cx="534" cy="238" rx="88" ry="72" fill="none" stroke="#ffffff" stroke-width="7"/>
  <polygon points="510,298 496,334 542,308" fill="#ffffff"/>

  <!-- Speech bubble - right (gold filled) -->
  <ellipse cx="618" cy="272" rx="88" ry="72" fill="#B8956A"/>
  <rect x="580" y="254" width="76" height="10" rx="5" fill="#ffffff"/>
  <rect x="580" y="272" width="56" height="10" rx="5" fill="#ffffff"/>
  <rect x="580" y="290" width="66" height="10" rx="5" fill="#ffffff"/>
  <polygon points="640,330 654,364 608,340" fill="#B8956A"/>

  <!-- Wordmark -->
  <text x="600" y="418" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="72" fill="#ffffff">
    <tspan font-style="italic" fill="#B8956A">i</tspan><tspan font-weight="bold">Write</tspan><tspan>Like</tspan><tspan font-weight="bold" fill="#B8956A">U</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#7EAA96" letter-spacing="3">AI content that writes like you</text>
</svg>
